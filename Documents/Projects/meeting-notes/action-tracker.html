<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Action Tracker - Ike's Board</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--s1:#161b22;--s2:#1c2129;--bd:#30363d;--bd2:#484f58;--tx:#e6edf3;--mu:#8b949e;--ac:#58a6ff;--gn:#3fb950;--yl:#d29922;--rd:#f85149;--or:#db6d28;--pu:#bc8cff;--pk:#f778ba;--cy:#39d2c0}
body{font-family:-apple-system,'SF Pro Text','Segoe UI',sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
input,textarea,select,button{font-family:inherit}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}}

/* Sidebar */
.side{background:var(--s1);border-right:1px solid var(--bd);padding:16px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.side h1{font-size:15px;padding:0 16px 12px;font-weight:700;border-bottom:1px solid var(--bd);margin-bottom:8px}
.sitem{padding:6px 16px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:var(--mu);border-left:2px solid transparent;transition:.1s}
.sitem:hover{color:var(--tx);background:rgba(255,255,255,.02)}
.sitem.on{color:var(--tx);border-left-color:var(--ac);background:rgba(88,166,255,.06)}
.sitem .d{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-right:8px}
.sitem .c{font-size:11px;background:var(--bg);border-radius:10px;padding:0 6px}
.sdiv{height:1px;background:var(--bd);margin:8px 16px}
.slbl{padding:6px 16px 2px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);font-weight:600}

/* Main */
.main{padding:20px 28px;overflow-y:auto}

/* Top bar */
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.topbar input[type=text]{background:var(--s1);border:1px solid var(--bd);border-radius:6px;color:var(--tx);padding:6px 10px;font-size:13px;width:220px}
.topbar input:focus{border-color:var(--ac);outline:none}
.btn{border:none;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:500;transition:.1s}
.btn-a{background:var(--ac);color:#fff}.btn-a:hover{opacity:.85}
.btn-o{background:transparent;border:1px solid var(--bd);color:var(--mu)}.btn-o:hover{border-color:var(--ac);color:var(--tx)}
.btn-d{background:rgba(248,81,73,.15);color:var(--rd)}.btn-d:hover{background:rgba(248,81,73,.25)}
.btn-s{padding:3px 8px;font-size:11px}

/* Dashboard */
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:24px}
.dcard{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;cursor:pointer;transition:.15s}
.dcard:hover{border-color:var(--bd2)}
.dcard.on{border-color:var(--ac)}
.dcard h3{font-size:11px;text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.dcard .pct{font-size:24px;font-weight:700}
.dcard .bar{height:5px;background:var(--bd);border-radius:3px;margin-top:6px;overflow:hidden}
.dcard .bar span{display:block;height:100%;border-radius:3px;transition:width .3s}
.dcard .sub{font-size:11px;color:var(--mu);margin-top:4px}

/* Project sections */
.proj{margin-bottom:28px}
.proj-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer;user-select:none}
.proj-head h2{font-size:15px;font-weight:600}
.proj-head .line{flex:1;height:1px;background:var(--bd)}
.proj-head .stats{font-size:12px;color:var(--mu);white-space:nowrap}
.proj-bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:12px}
.proj-bar span{display:block;height:100%;border-radius:3px;transition:width .3s}

/* Task card */
.task{background:var(--s1);border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;overflow:hidden;transition:border-color .1s}
.task:hover{border-color:var(--bd2)}
.task-head{padding:10px 12px;display:flex;align-items:center;gap:8px;cursor:pointer}
.task-head .arrow{color:var(--mu);font-size:10px;transition:transform .15s;width:14px;text-align:center;flex-shrink:0}
.task-head .arrow.open{transform:rotate(90deg)}
.task-name{flex:1;font-size:13px;font-weight:500}
.task-badges{display:flex;gap:4px;flex-shrink:0}
.badge{font-size:10px;padding:1px 7px;border-radius:10px;white-space:nowrap}
.b-ike{background:rgba(88,166,255,.12);color:var(--ac)}
.b-thomas{background:rgba(188,140,255,.12);color:var(--pu)}
.b-both{background:rgba(63,185,80,.12);color:var(--gn)}
.b-charlie{background:rgba(210,153,34,.12);color:var(--yl)}
.b-ext{background:rgba(248,81,73,.12);color:var(--rd)}
.b-date{background:var(--bg);border:1px solid var(--bd);color:var(--mu)}
.task-pct{font-size:11px;color:var(--mu);min-width:30px;text-align:right}
.task-minibar{width:60px;height:4px;background:var(--bd);border-radius:2px;overflow:hidden;flex-shrink:0}
.task-minibar span{display:block;height:100%;border-radius:2px}

/* Task body */
.task-body{display:none;padding:0 12px 12px;border-top:1px solid var(--bd)}
.task-body.open{display:block}
.task-detail{font-size:12px;color:var(--mu);padding:8px 0;line-height:1.5}

/* Steps */
.steps{margin:6px 0}
.step{display:flex;align-items:flex-start;gap:6px;padding:3px 0;font-size:12px}
.step input[type=checkbox]{margin-top:3px;accent-color:var(--ac);cursor:pointer;flex-shrink:0}
.step label{cursor:pointer;flex:1;transition:.1s}
.step.done label{text-decoration:line-through;color:var(--mu)}
.step .del-step{opacity:0;color:var(--rd);cursor:pointer;background:none;border:none;font-size:14px;padding:0 4px;transition:.1s;flex-shrink:0}
.step:hover .del-step{opacity:.6}
.step .del-step:hover{opacity:1}

/* Add step input */
.add-step{display:flex;gap:6px;margin-top:4px}
.add-step input{flex:1;background:var(--bg);border:1px solid var(--bd);border-radius:5px;color:var(--tx);padding:4px 8px;font-size:12px}
.add-step input:focus{border-color:var(--ac);outline:none}
.add-step input::placeholder{color:var(--bd2)}

/* Task note */
.task-note{margin-top:8px}
.task-note textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font-size:12px;padding:6px 8px;resize:vertical;min-height:32px}
.task-note textarea:focus{border-color:var(--ac);outline:none}

.task-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

/* Add task inline */
.add-task-row{display:flex;gap:6px;margin-top:6px}
.add-task-row input{flex:1;background:var(--s1);border:1px solid var(--bd);border-radius:6px;color:var(--tx);padding:6px 10px;font-size:13px}
.add-task-row input:focus{border-color:var(--ac);outline:none}
.add-task-row select{background:var(--s1);border:1px solid var(--bd);border-radius:6px;color:var(--tx);padding:6px;font-size:12px}

/* Scratchpad */
.scratch{margin-top:32px}
.scratch h2{font-size:14px;color:var(--mu);margin-bottom:8px}
#pad{width:100%;min-height:200px;background:var(--s1);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:'SF Mono',Menlo,monospace;font-size:13px;padding:12px;resize:vertical;line-height:1.6}
#pad:focus{border-color:var(--ac);outline:none}
.cbar{display:flex;gap:6px;margin:8px 0 4px;flex-wrap:wrap;align-items:center}
.cbar button,.cbar input{background:var(--s1);border:1px solid var(--bd);color:var(--tx);padding:3px 8px;border-radius:6px;cursor:pointer;font-size:11px}
.cbar button:hover{border-color:var(--ac)}
.cbar button.on{border-color:var(--ac);background:rgba(88,166,255,.08)}
#cvs{border:1px solid var(--bd);border-radius:8px;cursor:crosshair;display:block;background:var(--s1);width:100%}
</style>
</head>

// ============ STATE ============
const SK='at3';
function load(){try{return JSON.parse(localStorage.getItem(SK)||'{}')}catch{return{}}}
function save(){localStorage.setItem(SK,JSON.stringify(S))}
let S=load();

// Hydrate tasks
let tasks=JSON.parse(JSON.stringify(DEFAULT_TASKS));
// Merge saved step states
if(S.steps){
  tasks.forEach(t=>{
    if(S.steps[t.id]){
      // Merge steps: keep new defaults but apply saved done states and additions
      const saved=S.steps[t.id];
      // Apply saved done states to matching steps
      t.steps.forEach((s,i)=>{if(saved[i]!==undefined)s.d=saved[i]});
      // Append user-added steps
      if(S.added?.[t.id]){S.added[t.id].forEach(a=>t.steps.push({t:a.t,d:a.d}))}
    }
  });
}
// User-added tasks
if(S.userTasks){S.userTasks.forEach(ut=>{
  if(S.added?.[ut.id])S.added[ut.id].forEach(a=>ut.steps.push({t:a.t,d:a.d}));
  tasks.push(ut);
})}
// Notes
if(S.notes){tasks.forEach(t=>{if(S.notes[t.id])t.note=S.notes[t.id]})}
// Expanded
if(!S.expanded)S.expanded={};

function persistSteps(){
  S.steps={};
  tasks.forEach(t=>{
    // Save done states for default steps only
    const def=DEFAULT_TASKS.find(d=>d.id===t.id);
    const defLen=def?def.steps.length:0;
    const states={};
    t.steps.forEach((s,i)=>{if(i<defLen)states[i]=s.d});
    if(Object.keys(states).length)S.steps[t.id]=states;
  });
  save();
}
function persistAdded(){
  S.added={};
  tasks.forEach(t=>{
    const def=DEFAULT_TASKS.find(d=>d.id===t.id);
    const defLen=def?def.steps.length:(S.userTasks?.find(u=>u.id===t.id)?0:0);
    const extra=t.steps.slice(defLen).map(s=>({t:s.t,d:s.d}));
    if(extra.length)S.added[t.id]=extra;
  });
  save();
}
function persistNotes(){
  S.notes={};
  tasks.forEach(t=>{if(t.note)S.notes[t.id]=t.note});
  save();
}
function persistAll(){persistSteps();persistAdded();persistNotes();save()}

// ============ CALC ============
function taskPct(t){
  if(!t.steps||!t.steps.length)return 0;
  return Math.round(t.steps.filter(s=>s.d).length/t.steps.length*100);
}
function projPct(pk){
  const pt=tasks.filter(t=>t.project===pk);
  if(!pt.length)return 0;
  return Math.round(pt.reduce((s,t)=>s+taskPct(t),0)/pt.length);
}
function projStats(pk){
  const pt=tasks.filter(t=>t.project===pk);
  const done=pt.filter(t=>taskPct(t)>=100).length;
  return{total:pt.length,done,pct:projPct(pk)};
}
function pColor(p){return p>=100?'var(--gn)':p>=50?'var(--ac)':p>0?'var(--yl)':'var(--bd)'}

// ============ NAV ============
let nav='all';
let search='';

function setNav(n){nav=n;render()}

// ============ RENDER ============
function render(){
  renderSide();renderMain();
}

function renderSide(){
  const el=document.getElementById('side');
  let h=`<h1>Ike's Board</h1>`;
  h+=`<div class="slbl">Views</div>`;
  h+=si('all','All Projects',tasks.length,'var(--ac)');
  h+=`<div class="sdiv"></div><div class="slbl">Projects</div>`;
  for(const[k,p]of Object.entries(P)){
    const c=tasks.filter(t=>t.project===k).length;
    if(c)h+=si(k,p.l,c,p.c);
  }
  h+=`<div class="sdiv"></div>`;
  h+=si('scratch','Scratchpad & Draw','','var(--mu)');
  el.innerHTML=h;
}

function si(id,label,cnt,color){
  return`<div class="sitem ${nav===id?'on':''}" onclick="setNav('${id}')"><span style="display:flex;align-items:center"><span class="d" style="background:${color}"></span>${label}</span>${cnt?`<span class="c">${cnt}</span>`:''}</div>`;
}

function renderMain(){
  const el=document.getElementById('main');
  if(nav==='scratch'){el.innerHTML=renderScratch();setTimeout(initCvs,80);return}

  let h='';
  // Top bar
  h+=`<div class="topbar"><input type="text" placeholder="Search tasks..." value="${search}" oninput="search=this.value;render()"><button class="btn btn-a" onclick="addTask()">+ Add Task</button><button class="btn btn-o" onclick="exportJSON()">Export</button></div>`;

  // Dashboard
  h+=renderDash();

  // Projects
  const show=nav==='all'?Object.keys(P):[nav];
  for(const pk of show){
    const pt=tasks.filter(t=>t.project===pk);
    if(!pt.length)continue;
    if(search){const q=search.toLowerCase();const f=pt.filter(t=>(t.name+' '+(t.detail||'')+' '+t.steps.map(s=>s.t).join(' ')).toLowerCase().includes(q));if(!f.length)continue;}
    h+=renderProject(pk,pt);
  }

  // Scratchpad on all view
  if(nav==='all')h+=renderScratch();

  el.innerHTML=h;
  if(nav==='all')setTimeout(initCvs,80);
}

function renderDash(){
  let h=`<div class="dash">`;
  // Overall
  const allPct=tasks.length?Math.round(tasks.reduce((s,t)=>s+taskPct(t),0)/tasks.length):0;
  const allDone=tasks.filter(t=>taskPct(t)>=100).length;
  h+=`<div class="dcard ${nav==='all'?'on':''}" onclick="setNav('all')"><h3 style="color:var(--ac)">Overall</h3><div class="pct" style="color:var(--ac)">${allPct}%</div><div class="bar"><span style="width:${allPct}%;background:var(--ac)"></span></div><div class="sub">${allDone}/${tasks.length} tasks complete</div></div>`;

  const show=nav==='all'?Object.keys(P):[nav];
  for(const pk of show){
    const s=projStats(pk);if(!s.total)continue;
    const p=P[pk];
    h+=`<div class="dcard ${nav===pk?'on':''}" onclick="setNav('${pk}')"><h3 style="color:${p.c}">${p.l}</h3><div class="pct" style="color:${p.c}">${s.pct}%</div><div class="bar"><span style="width:${s.pct}%;background:${p.c}"></span></div><div class="sub">${s.done}/${s.total} tasks</div></div>`;
  }
  h+=`</div>`;
  return h;
}

function renderProject(pk,pt){
  const p=P[pk];const s=projStats(pk);
  let filt=pt;
  if(search){const q=search.toLowerCase();filt=pt.filter(t=>(t.name+' '+(t.detail||'')+' '+t.steps.map(s=>s.t).join(' ')).toLowerCase().includes(q))}

  let h=`<div class="proj">`;
  h+=`<div class="proj-head"><h2 style="color:${p.c}">${p.l}</h2><span class="line"></span><span class="stats">${s.done}/${s.total} done &middot; ${s.pct}%</span></div>`;
  h+=`<div class="proj-bar"><span style="width:${s.pct}%;background:${p.c}"></span></div>`;

  filt.forEach(t=>h+=renderTask(t,p.c));

  // Add task inline
  h+=`<div class="add-task-row"><input type="text" id="newTask-${pk}" placeholder="+ Add a task to ${p.l}..." onkeydown="if(event.key==='Enter')addTaskInline('${pk}')"><button class="btn btn-o" onclick="addTaskInline('${pk}')">Add</button></div>`;

  h+=`</div>`;
  return h;
}

function ownerBadge(o){
  const m={ike:['Ike','b-ike'],thomas:['Thomas','b-thomas'],both:['Both','b-both'],charlie:['Charlie','b-charlie'],ext:['Ext.','b-ext']};
  const x=m[o]||['?','b-ext'];return`<span class="badge ${x[1]}">${x[0]}</span>`;
}

function renderTask(t,projColor){
  const pct=taskPct(t);
  const exp=S.expanded[t.id];
  let h=`<div class="task ${pct>=100?'done':''}">`;

  // Head
  h+=`<div class="task-head" onclick="togExp('${t.id}')">`;
  h+=`<span class="arrow ${exp?'open':''}">&#9654;</span>`;
  h+=`<span class="task-name">${t.name}</span>`;
  h+=`<div class="task-badges">${ownerBadge(t.owner)}<span class="badge b-date">${t.date}</span></div>`;
  h+=`<div class="task-minibar"><span style="width:${pct}%;background:${pColor(pct)}"></span></div>`;
  h+=`<span class="task-pct">${pct}%</span>`;
  h+=`</div>`;

  // Body
  h+=`<div class="task-body ${exp?'open':''}">`;
  if(t.detail)h+=`<div class="task-detail">${t.detail}</div>`;

  // Steps
  h+=`<div class="steps">`;
  t.steps.forEach((s,i)=>{
    h+=`<div class="step ${s.d?'done':''}">
      <input type="checkbox" ${s.d?'checked':''} onchange="togStep('${t.id}',${i})">
      <label onclick="togStep('${t.id}',${i})">${s.t}</label>
      <button class="del-step" onclick="delStep('${t.id}',${i})" title="Remove">&times;</button>
    </div>`;
  });
  h+=`</div>`;

  // Add step
  h+=`<div class="add-step"><input type="text" id="addStep-${t.id}" placeholder="+ Add a step..." onkeydown="if(event.key==='Enter')addStep('${t.id}')"><button class="btn btn-o btn-s" onclick="addStep('${t.id}')">Add</button></div>`;

  // Note
  h+=`<div class="task-note"><textarea placeholder="Notes..." oninput="saveNote('${t.id}',this.value)">${t.note||''}</textarea></div>`;

  // Actions
  h+=`<div class="task-actions"><button class="btn btn-o btn-s" onclick="checkAll('${t.id}')">Check All</button><button class="btn btn-o btn-s" onclick="uncheckAll('${t.id}')">Uncheck All</button><button class="btn btn-d btn-s" onclick="delTask('${t.id}')" style="margin-left:auto">Delete Task</button></div>`;

  h+=`</div></div>`;
  return h;
}

// ============ INTERACTIONS ============
function togExp(id){S.expanded[id]=!S.expanded[id];save();render()}

function togStep(id,i){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  t.steps[i].d=!t.steps[i].d;
  persistAll();render();
}

function addStep(id){
  const inp=document.getElementById('addStep-'+id);
  const val=inp?.value.trim();if(!val)return;
  const t=tasks.find(x=>x.id===id);if(!t)return;
  t.steps.push({t:val,d:false});
  persistAll();render();
  // Re-expand and focus
  S.expanded[id]=true;save();render();
  setTimeout(()=>{const el=document.getElementById('addStep-'+id);if(el)el.focus()},50);
}

function delStep(id,i){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  t.steps.splice(i,1);
  persistAll();render();
}

function checkAll(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  t.steps.forEach(s=>s.d=true);persistAll();render();
}
function uncheckAll(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  t.steps.forEach(s=>s.d=false);persistAll();render();
}

function saveNote(id,val){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  t.note=val;persistNotes();
}

function delTask(id){
  if(!confirm('Delete this task?'))return;
  tasks=tasks.filter(t=>t.id!==id);
  if(S.userTasks)S.userTasks=S.userTasks.filter(t=>t.id!==id);
  persistAll();render();
}

function addTaskInline(pk){
  const inp=document.getElementById('newTask-'+pk);
  const val=inp?.value.trim();if(!val)return;
  const t={id:'u'+Date.now(),name:val,project:pk,owner:'ike',date:'8/27',detail:'',steps:[],note:''};
  tasks.push(t);
  if(!S.userTasks)S.userTasks=[];
  S.userTasks.push(t);
  S.expanded[t.id]=true;
  persistAll();render();
  setTimeout(()=>{const el=document.getElementById('addStep-'+t.id);if(el)el.focus()},50);
}

function addTask(){
  const name=prompt('Task name:');if(!name)return;
  const pk=nav!=='all'&&nav!=='scratch'?nav:'general';
  const t={id:'u'+Date.now(),name,project:pk,owner:'ike',date:'8/27',detail:'',steps:[],note:''};
  tasks.push(t);
  if(!S.userTasks)S.userTasks=[];
  S.userTasks.push(t);
  S.expanded[t.id]=true;
  persistAll();render();
}

function exportJSON(){
  const blob=new Blob([JSON.stringify({tasks,state:S},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='tracker-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}

// ============ SCRATCHPAD & CANVAS ============
function renderScratch(){
  return`<div class="scratch"><h2>Scratchpad</h2><textarea id="pad" oninput="S._pad=this.value;save()" placeholder="Freeform notes, ideas, to-do lists...">${S._pad||''}</textarea></div>
  <div class="scratch" style="margin-top:16px"><h2>Draw</h2>
  <div class="cbar"><button class="on" onclick="cT='pen';document.querySelectorAll('.cbar button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">Pen</button><button onclick="cT='eraser';document.querySelectorAll('.cbar button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">Eraser</button><input type="color" value="#58a6ff" onchange="cC=this.value" title="Color"><input type="range" min="1" max="24" value="3" oninput="cW=+this.value" style="width:80px"><button onclick="clrCvs()">Clear</button></div>
  <canvas id="cvs" width="1100" height="500"></canvas></div>`;
}

let cT='pen',cC='#58a6ff',cW=3,dr=false;
function clrCvs(){const c=document.getElementById('cvs');if(!c)return;c.getContext('2d').clearRect(0,0,c.width,c.height);delete S._cvs;save()}

function initCvs(){
  const c=document.getElementById('cvs');if(!c||c._ok)return;c._ok=true;
  const ctx=c.getContext('2d');
  if(S._cvs){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=S._cvs}
  function pos(e){const r=c.getBoundingClientRect();const sx=c.width/r.width,sy=c.height/r.height;const cx=e.touches?e.touches[0].clientX:e.clientX,cy=e.touches?e.touches[0].clientY:e.clientY;return{x:(cx-r.left)*sx,y:(cy-r.top)*sy}}
  function dn(e){e.preventDefault();dr=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)}
  function mv(e){if(!dr)return;e.preventDefault();const p=pos(e);ctx.lineWidth=cW;ctx.lineCap='round';ctx.strokeStyle=cT==='eraser'?'#161b22':cC;ctx.globalCompositeOperation=cT==='eraser'?'destination-out':'source-over';ctx.lineTo(p.x,p.y);ctx.stroke()}
  function up(){if(dr){dr=false;S._cvs=c.toDataURL();save()}}
  c.onmousedown=dn;c.onmousemove=mv;c.onmouseup=up;c.onmouseleave=up;
  c.ontouchstart=dn;c.ontouchmove=mv;c.ontouchend=up;
}

// ============ INIT ============
render();
</script>
